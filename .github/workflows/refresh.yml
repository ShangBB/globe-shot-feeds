name: Refresh the live feed

on:
  # 每天自动刷一遍（2026-10-14 挂上，产品决定：feed 每天更新一次）。
  #
  # 额度上现在是安全的：两段式取源把全量刷新从 13,800 units 降到约 210（实测 105 个频道 758 units，
  # 其中 L0 复用命中 70 条），而 L3 兜底另有**每轮 30 次搜索调用**的硬上限——挖矿那边也扣着同样的数
  # （`Quota.searchReservedForRefresh`），两边加起来正好是搜索桶一天的 100 次。
  #
  # 第一次成功运行已经打通：feed 98 条、账本 7 条 offAir，GitHub Pages 已服务到新数据。
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    # 手动触发时可以只刷前 N 条：data 分支要等第一次成功运行才存在，
    # 用这个先把部署链路和联调数据打通。
    inputs:
      limit:
        description: "只刷前 N 个频道（联调用；留空表示全部）"
        required: false
        type: string

permissions:
  # 默认只读，不加这行推不到 data 分支。
  contents: write

jobs:
  refresh:
    # 用 macOS 是为了拿到自带的 Swift 工具链；仓库是公开的，分钟数不限，
    # 所以这里不在意 macOS 的 10 倍计费。
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: 取上一次的产物与清理账本
        run: |
          set -euo pipefail
          # data 分支上永远只有这两份文件（孤儿提交）。取不到不影响正确性，只是这一轮全部走"查窗口"、
          # 账本从零开始——多花几十 units，且要等一周才够判一个频道。
          # 拿得到的话：feed 里仍在播的条目会被直接复用（复用的是已经被用户验证过可播的那条流），
          # 账本则用来累计"连续几次没拿到可播的流"。
          git fetch -q origin data --depth=1 || true

          if git show origin/data:live-youtube.json > previous-live-youtube.json 2>/dev/null; then
            echo "拿到上一次的产物：$(wc -c < previous-live-youtube.json | tr -d ' ') 字节"
          else
            echo "没有上一次的产物，这一轮不复用"
            rm -f previous-live-youtube.json
          fi

          if git show origin/data:refresh-state.json > previous-refresh-state.json 2>/dev/null; then
            echo "拿到上一次的清理账本：$(wc -c < previous-refresh-state.json | tr -d ' ') 字节"
          else
            echo "没有上一次的账本，从零开始记"
            rm -f previous-refresh-state.json
          fi

      - name: 生成 live-youtube.json
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          PREVIOUS=""
          if [ -f previous-live-youtube.json ]; then
            PREVIOUS="--previous previous-live-youtube.json"
          fi
          STATE=""
          if [ -f previous-refresh-state.json ]; then
            STATE="--state previous-refresh-state.json"
          fi
          if [ -n "${LIMIT:-}" ]; then
            swift Scripts/youtube.swift refresh --limit "$LIMIT" $PREVIOUS $STATE
          else
            swift Scripts/youtube.swift refresh $PREVIOUS $STATE
          fi

          # 账本出了阈值就该处理了。CI 不能改 main 分支上的 curation.json / channels-source.json，
          # 所以这里只能提示：本地跑一次 `swift Scripts/youtube.swift prune`（0 units）。
          # 脚本自己已经把"观察中 N 条 / 已达阈值 M 条"打在上面了。
          if [ -f refresh-state.json ]; then
            echo "::notice::清理账本已更新；若有达阈值的频道，本地跑 prune 处理（0 units）"
          fi

      - name: 推到 data 分支
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 没有产物就跳过（例如上游失败、或此刻没有任何频道在直播），
          # 让上一次的数据继续服务，绝不用空文件覆盖。
          if [ ! -f "$GITHUB_WORKSPACE/live-youtube.json" ]; then
            echo "本轮没有产物，跳过推送。"
            exit 0
          fi

          cd "$RUNNER_TEMP"
          rm -rf publish && mkdir publish && cd publish
          git init -q
          git checkout -q -b data
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          cp "$GITHUB_WORKSPACE/live-youtube.json" .
          git add live-youtube.json

          # 清理账本一并带上：下一次运行要靠它累计"连续几次没拿到可播的流"。
          if [ -f "$GITHUB_WORKSPACE/refresh-state.json" ]; then
            cp "$GITHUB_WORKSPACE/refresh-state.json" .
            git add refresh-state.json
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "chore: refresh the live feed"

          # 孤儿分支 + force push：data 分支上永远只有一个提交，不留历史。
          git push -q --force origin data
